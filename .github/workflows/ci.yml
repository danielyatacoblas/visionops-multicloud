name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  local-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/render_diagrams.py --check
      - run: python scripts/generate_load.py --profile smoke --output artifacts/scale-input
      - run: python scripts/run_scale.py --input artifacts/scale-input --output artifacts/scale-report
      - run: python scripts/benchmark_api.py --rows 1000 --partition-rows 500 --output artifacts/api-smoke

  terraform-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra

  terraform-safe-default:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aws, gcp, azure]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/${{ matrix.cloud }} init -backend=false
      - run: terraform -chdir=infra/${{ matrix.cloud }} test
